<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Work Schedule</title>
<style>
:root{--bg:#eef4f7;--card:#fff;--tx:#1c2b33;--bd:#cfd9df;--wc:#0f8b8d;--wl:#d7efee;--wd:#094f51;--dn:#094f51;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#161b2e;--card:#232a45;--tx:#eef1fa;--bd:#3a4468;--dn:var(--wl)}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.ban{background:linear-gradient(135deg,#0f8b8d,#2f6fdb);color:#fff;border-radius:0 0 22px 22px;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 18px;text-align:center}
.bn{font-size:24px;font-weight:bold;word-break:break-word}.ba{font-size:14px;margin-top:4px;opacity:.95;word-break:break-word}.bt{font-size:12px;letter-spacing:1.5px;font-weight:bold;margin-top:10px;opacity:.9}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
label{display:block;font-size:12px;font-weight:bold;margin:8px 0 3px}
label:first-child{margin-top:0}
input{background:#fff;color:#1c2b33;border:1px solid #cfd9df;border-radius:8px;padding:8px;font:inherit;font-size:15px;width:100%;min-width:0;color-scheme:light}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.tab{flex:none;border:0;border-bottom:3px solid var(--c,#0f8b8d);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 14px;font:bold 14px Arial;cursor:pointer;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{background:var(--c);color:#fff}.tab.add{border-bottom-color:var(--bd);opacity:.9}
.r{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.7fr);gap:4px;align-items:center;margin-bottom:5px}
.r input{padding:5px 3px;font-size:13px}
.r input[type=time]{text-align:center}
.hd{font-size:11px;font-weight:bold;text-align:center;color:var(--wd);background:var(--wl);border-radius:8px;padding:6px 2px;margin-bottom:6px}
.dn{color:var(--dn);font-size:13px;min-height:15px}.dh{display:flex;align-items:center;justify-content:space-between;gap:3px;margin-bottom:2px}.off{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:6px;font:bold 9px Arial;padding:2px 4px;cursor:pointer}.off.on{background:#e76f51;border-color:#e76f51;color:#fff}.offr input:not([type=date]){opacity:.45}
.tot{background:var(--wc);color:#fff;border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;font-weight:bold;margin-top:8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.b{border:0;border-radius:12px;padding:13px 6px;font:bold 14px Arial;color:#fff;cursor:pointer}
#bn0{background:#0f8b8d}#bexp{background:#5f7f8f}#bimp{background:#8a6fd1}#bn2{background:#d6336c}#bn1{background:#e76f51}#bsave{background:#2f9e44}#bshare{background:#7b5ea7}#bprint{background:#2f6fdb}
#rm{margin-top:10px;border:1px solid #d6336c;background:transparent;color:#d6336c;border-radius:10px;padding:8px 12px;font:bold 13px Arial;cursor:pointer}
#rm:disabled{opacity:.4;cursor:default}
.ck{display:flex;align-items:center;gap:6px;font-weight:normal;font-size:13px;margin:0}input[type=checkbox]{width:20px;height:20px;padding:0}
#pv{display:none}
@page{size:letter;margin:36pt}@media print{#app{display:none!important}#pv{display:block}body{background:#fff!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="app">
<header class="ban"><div id="bn" class="bn"></div><div id="ba" class="ba"></div><div class="bt">WEEKLY WORK SCHEDULE</div></header>
<main>
<section class="card">
<label for="sn">Store name</label><input id="sn" placeholder="Store name">
<label for="sa">Store address</label><input id="sa" placeholder="Store address">
<div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap"><label class="ck"><input type="checkbox" id="shn" checked> Show store name</label><label class="ck"><input type="checkbox" id="sha" checked> Show address</label></div>
<label for="wk">Week starts</label><input id="wk" type="date">
</section>
<div class="tabs" id="tabs"></div>
<section class="card">
<label for="emp">Employee</label><input id="emp" placeholder="Employee name">
<button id="rm" type="button">Remove worker</button>
</section>
<section class="card">
<div class="r hd"><div>DAY / DATE</div><div>START</div><div>END</div><div>HOURS</div></div>
<div id="rows"></div>
<div class="tot"><span>TOTAL HOURS</span><span id="tot">0</span></div>
</section>
<div class="btns">
<button class="b" id="bn0" type="button">Next week (keep times)</button>
<button class="b" id="bn2" type="button">Clear times</button>
<button class="b" id="bn1" type="button">Next week (clear times)</button>
<button class="b" id="bsave" type="button">Save PDF</button>
<button class="b" id="bshare" type="button">Share PDF</button>
<button class="b" id="bprint" type="button">Print</button>
</div>
<div class="btns" style="margin-top:8px"><button class="b" id="bexp" type="button">Export backup</button><button class="b" id="bimp" type="button">Import backup</button></div>
<input type="file" id="fimp" accept=".json,application/json" style="display:none">
</main>
</div>
<div id="pv"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAL=[['#0f8b8d','#d7efee','#094f51'],['#e76f51','#fce3db','#8f3a24'],['#7b5ea7','#e8def5','#4a3470'],['#2f6fdb','#dbe7fb','#1b4296'],['#d6336c','#fbdce8','#8a1f45'],['#2f9e44','#d8f0dd','#1c6029']];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=String(s||'').split('-').map(Number);return p.length===3&&p[0]&&p[1]&&p[2]?new Date(p[0],p[1]-1,p[2]):null};
const addD=(s,n)=>{const d=parse(s)||new Date();d.setDate(d.getDate()+n);return iso(d)};
const dayName=s=>{const d=parse(s);return d?d.toLocaleDateString('en-US',{weekday:'long'}):''};
const shortD=s=>{const d=parse(s);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):''};
const longD=s=>{const d=parse(s);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):''};
const t12=t=>{if(!t)return'-';const a=t.split(':').map(Number);return((a[0]%12)||12)+':'+pad(a[1])+' '+(a[0]<12?'AM':'PM')};
const calc=(s,e)=>{if(!s||!e)return'';const a=s.split(':').map(Number),b=e.split(':').map(Number);let m=b[0]*60+b[1]-a[0]*60-a[1];if(m<0)m+=1440;return Math.round(m/60*100)/100};
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const total=w=>Math.round(w.days.reduce((a,d)=>a+num(d.hours),0)*100)/100;
const wc=i=>PAL[i%6];

function monday(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function mkWorker(name,week){return{name:name,days:Array.from({length:7},(_,i)=>({date:addD(week,i),start:'',end:'',hours:'',off:false}))}}
function defaults(){const w=monday();return{store:'',addr:'',week:w,sel:0,workers:[mkWorker('Worker 1',w),mkWorker('Worker 2',w)]}}
function sane(s){
  if(!s||typeof s!=='object'||!Array.isArray(s.workers)||!s.workers.length||!parse(s.week))return false;
  return s.workers.every(w=>w&&typeof w.name==='string'&&Array.isArray(w.days)&&w.days.length===7&&w.days.every(d=>d&&typeof d.date==='string'&&typeof d.start==='string'&&typeof d.end==='string'));
}
let S;
try{S=JSON.parse(localStorage.getItem('wsched'));}catch(e){S=null}
if(!sane(S))S=defaults();
S.store=String(S.store||'');S.addr=String(S.addr||'');S.showName=S.showName!==false;S.showAddr=S.showAddr!==false;
S.sel=Math.min(Math.max(parseInt(S.sel)||0,0),S.workers.length-1);
S.workers.forEach(w=>w.days.forEach(d=>{d.hours=d.hours===''||d.hours==null?'':String(d.hours);d.off=!!d.off}));
function save(){try{localStorage.setItem('wsched',JSON.stringify(S))}catch(e){}}

function norm(x){x.store=String(x.store||'');x.addr=String(x.addr||'');x.showName=x.showName!==false;x.showAddr=x.showAddr!==false;x.sel=Math.min(Math.max(parseInt(x.sel)||0,0),x.workers.length-1);x.workers.forEach(w=>w.days.forEach(d=>{d.hours=d.hours===''||d.hours==null?'':String(d.hours);d.off=!!d.off}))}
function syncAll(){$('sn').value=S.store;$('sa').value=S.addr;$('wk').value=S.week;$('shn').checked=S.showName;$('sha').checked=S.showAddr;banner();render()}
function banner(){$('bn').textContent=S.store||'Store name';$('ba').textContent=S.addr||'Store address';$('bn').style.display=S.showName?'':'none';$('ba').style.display=S.showAddr?'':'none'}
function updTotal(){$('tot').textContent=total(S.workers[S.sel])}
function render(){
  const w=S.workers[S.sel],c=wc(S.sel),app=$('app');
  app.style.setProperty('--wc',c[0]);app.style.setProperty('--wl',c[1]);app.style.setProperty('--wd',c[2]);
  document.documentElement.style.setProperty('--wc',c[0]);document.documentElement.style.setProperty('--wl',c[1]);document.documentElement.style.setProperty('--wd',c[2]);
  $('tabs').innerHTML=S.workers.map((x,i)=>'<button type="button" class="tab'+(i===S.sel?' on':'')+'" data-i="'+i+'" style="--c:'+wc(i)[0]+'">'+esc(x.name||'Worker '+(i+1))+'</button>').join('')+'<button type="button" class="tab add" id="add">+ Add worker</button>';
  $('emp').value=w.name;
  $('rows').innerHTML=w.days.map((d,j)=>'<div class="r'+(d.off?' offr':'')+'" id="r'+j+'"><div><div class="dh"><b class="dn" id="dn'+j+'">'+esc(dayName(d.date))+'</b><button type="button" class="off'+(d.off?' on':'')+'" data-off="'+j+'">OFF</button></div><input type="date" data-j="'+j+'" data-f="date" value="'+esc(d.date)+'"></div><input type="time" data-j="'+j+'" data-f="start" value="'+esc(d.start)+'"><input type="time" data-j="'+j+'" data-f="end" value="'+esc(d.end)+'"><input type="number" step="any" min="0" inputmode="decimal" id="h'+j+'" data-j="'+j+'" data-f="hours" value="'+esc(d.hours)+'"></div>').join('');
  $('rm').disabled=S.workers.length<2;resetRm();updTotal();
}
$('shn').checked=S.showName;$('sha').checked=S.showAddr;
$('shn').onchange=e=>{S.showName=e.target.checked;banner();save()};
$('sha').onchange=e=>{S.showAddr=e.target.checked;banner();save()};
$('sn').value=S.store;$('sa').value=S.addr;$('wk').value=S.week;
$('sn').oninput=e=>{S.store=e.target.value;banner();save()};
$('sa').oninput=e=>{S.addr=e.target.value;banner();save()};
$('wk').onchange=e=>{if(!parse(e.target.value)){e.target.value=S.week;return}S.week=e.target.value;S.workers.forEach(w=>w.days.forEach((d,i)=>d.date=addD(S.week,i)));save();render()};
$('emp').oninput=e=>{const w=S.workers[S.sel];w.name=e.target.value;const t=document.querySelector('.tab.on');if(t)t.textContent=w.name||'Worker '+(S.sel+1);save()};
function rowEv(e){
  const t=e.target,f=t.dataset.f;if(!f)return;
  const j=+t.dataset.j,d=S.workers[S.sel].days[j];
  d[f]=t.value;if(f!=='date'&&t.value!==''&&d.off){d.off=false;$('r'+j).classList.remove('offr');document.querySelector('[data-off="'+j+'"]').classList.remove('on')}
  if(f==='date')$('dn'+j).textContent=dayName(t.value);
  if(f==='start'||f==='end'){d.hours=String(calc(d.start,d.end));if(!d.start||!d.end)d.hours='';$('h'+j).value=d.hours}
  updTotal();save();
}
$('rows').addEventListener('click',e=>{const b=e.target.closest('[data-off]');if(!b)return;const d=S.workers[S.sel].days[+b.dataset.off];d.off=!d.off;if(d.off){d.start='';d.end='';d.hours=''}save();render()});
$('rows').addEventListener('input',rowEv);$('rows').addEventListener('change',rowEv);
$('tabs').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='add'){S.workers.push(mkWorker('Worker '+(S.workers.length+1),S.week));S.sel=S.workers.length-1;save();render();const t=document.querySelector('.tab.on');if(t)t.scrollIntoView({inline:'center',block:'nearest'})}
  else{S.sel=+b.dataset.i;save();render()}
};
function arm(btn,label,fn){
  if(btn._t){clearTimeout(btn._t);btn._t=null;btn.textContent=label;fn();return}
  btn.textContent='Tap again to confirm';
  btn._t=setTimeout(()=>{btn._t=null;btn.textContent=label},4000);
}
function resetRm(){const b=$('rm');if(b._t){clearTimeout(b._t);b._t=null}b.textContent='Remove worker'}
$('rm').onclick=()=>{if(S.workers.length<2)return;arm($('rm'),'Remove worker',()=>{S.workers.splice(S.sel,1);S.sel=Math.min(S.sel,S.workers.length-1);save();render()})};
$('bn0').onclick=()=>arm($('bn0'),'Next week (keep times)',()=>{S.week=addD(S.week,7);$('wk').value=S.week;S.workers.forEach(w=>w.days.forEach(d=>{d.date=addD(d.date,7)}));save();render()});
$('bn2').onclick=()=>arm($('bn2'),'Clear times',()=>{S.workers.forEach(w=>w.days.forEach(d=>{d.start='';d.end='';d.hours='';d.off=false}));save();render()});
$('bn1').onclick=()=>arm($('bn1'),'Next week (clear times)',()=>{
  S.week=addD(S.week,7);$('wk').value=S.week;
  S.workers.forEach(w=>w.days.forEach(d=>{d.date=addD(d.date,7);d.start='';d.end='';d.hours='';d.off=false}));save();render();
});

function flash(btn,text,ms){
  if(!btn.dataset.o)btn.dataset.o=btn.textContent;
  btn.textContent=text;clearTimeout(btn._f);
  btn._f=setTimeout(()=>{btn.textContent=btn.dataset.o},ms||2000);
}
function buildPdf(){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
  const doc=new J({unit:'pt',format:'letter'});
  const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const fill=h=>doc.setFillColor.apply(doc,rgb(h)),txt=h=>doc.setTextColor.apply(doc,rgb(h));
  const cut=(s,w)=>doc.splitTextToSize(String(s),w)[0]||'';
  fill('#1f3a4d');doc.rect(0,0,612,84,'F');txt('#ffffff');
  let by=32;txt('#ffffff');
  if(S.showName){doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text(cut(S.store||'Store name',540),36,by);by+=17}
  if(S.showAddr){doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text(cut(S.addr||'Store address',540),36,by);by+=17}
  doc.setFont('helvetica','bold');doc.setFontSize(12);
  doc.text('WEEKLY WORK SCHEDULE: '+longD(S.week)+' - '+longD(addD(S.week,6)),36,by+4);
  const n=S.workers.length,k=Math.min(n,4),GAP=k>=4?10:12,BAR=k>=4?20:24,HD=k>=4?16:20,X=[36,306,396,486];
  const rowH=Math.min(44,Math.floor(((792-100-36-(k-1)*GAP)/k-BAR*2-HD)/7)),H=BAR*2+HD+7*rowH;
  const fs=Math.min(14,Math.max(9,Math.round(rowH*0.38)));
  let y=100,cnt=0;
  S.workers.forEach((w,i)=>{
    const c=wc(i);
    if(cnt===k){doc.addPage();y=36;cnt=0}
    fill(c[0]);doc.rect(36,y,540,BAR,'F');txt('#ffffff');doc.setFont('helvetica','bold');doc.setFontSize(fs+2);
    doc.text(cut('Employee: '+(w.name||'Worker '+(i+1)),520),44,y+BAR/2+(fs+2)*0.35);
    fill(c[1]);doc.rect(36,y+BAR,540,HD,'F');txt(c[2]);doc.setFontSize(Math.min(fs,10));
    ['DAY / DATE','START','END','HOURS'].forEach((h,m)=>doc.text(h,X[m]+8,y+BAR+HD/2+3.5));
    doc.setDrawColor.apply(doc,rgb('#cfd9df'));
    w.days.forEach((d,j)=>{
      const ry=y+BAR+HD+j*rowH,ty=ry+rowH/2+fs*0.35;
      txt(c[2]);doc.setFont('helvetica','bold');doc.setFontSize(fs);
      doc.text(dayName(d.date)+', '+shortD(d.date),X[0]+8,ty);
      txt('#222222');doc.setFont('helvetica','normal');
      doc.text(d.off?'OFF':t12(d.start),X[1]+8,ty);doc.text(d.off?'OFF':t12(d.end),X[2]+8,ty);
      doc.text(String(num(d.hours)),X[3]+8,ty);
      doc.line(36,ry+rowH,576,ry+rowH);
    });
    const ty0=y+BAR+HD+7*rowH;
    fill(c[0]);doc.rect(36,ty0,540,BAR,'F');txt('#ffffff');doc.setFont('helvetica','bold');doc.setFontSize(fs+1);
    doc.text('TOTAL HOURS',44,ty0+BAR/2+(fs+1)*0.35);doc.text(String(total(w)),568,ty0+BAR/2+(fs+1)*0.35,{align:'right'});
    y+=H+GAP;cnt++;
  });
  return doc;
}
let D=null;
try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{D=d}).catch(()=>{})}catch(e){}
async function dl(name,buf,type){
  if(D){await D.save({filename:name,data:buf});return}
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&navigator.canShare){const f=new File([buf],name,{type:type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}
  const u=URL.createObjectURL(new Blob([buf],{type:type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
}
async function saveDoc(btn,ms,msg){
  const doc=buildPdf();if(!doc){flash(btn,'Could not save');return}
  try{await dl('Weekly_Schedule.pdf',doc.output('arraybuffer'),'application/pdf');flash(btn,msg||'Saved',ms)}
  catch(e){if(e&&(e.code==='declined'||e.name==='AbortError'))return;flash(btn,'Could not save')}
}
$('bexp').onclick=async()=>{const b=$('bexp');try{await dl('Schedule_Backup.json',new TextEncoder().encode(JSON.stringify(S)).buffer,'application/json');flash(b,'Saved')}catch(e){if(e&&(e.code==='declined'||e.name==='AbortError'))return;flash(b,'Could not save')}};
$('bimp').onclick=()=>$('fimp').click();
$('fimp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const b=$('bimp');try{const x=JSON.parse(await f.text());if(!sane(x))throw 0;S=x;norm(S);save();syncAll();flash(b,'Imported')}catch(err){flash(b,'Invalid file')}};
$('bsave').onclick=()=>saveDoc($('bsave'));
$('bshare').onclick=async()=>{
  const btn=$('bshare'),doc=buildPdf();if(!doc){flash(btn,'Could not share');return}
  try{
    const file=new File([doc.output('arraybuffer')],'Weekly_Schedule.pdf',{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Weekly Work Schedule'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  saveDoc(btn);
};
function printView(){
  const n=S.workers.length,k=Math.min(n,4),GAP=k>=4?10:12,BAR=k>=4?20:24,HD=k>=4?16:20;
  const rowH=Math.min(44,Math.floor(((630-(k-1)*GAP)/k-BAR*2-HD)/7)),fs=Math.min(14,Math.max(9,Math.round(rowH*0.38)));
  const tbl=(w,i)=>{const c=wc(i);return '<table style="width:100%;table-layout:fixed;border-collapse:collapse;margin-bottom:'+GAP+'pt;font-size:'+fs+'pt"><colgroup><col style="width:50%"><col style="width:16.7%"><col style="width:16.7%"><col style="width:16.6%"></colgroup>'+
  '<tr style="height:'+BAR+'pt"><td colspan="4" style="background:'+c[0]+';color:#fff;font-weight:bold;font-size:'+(fs+2)+'pt">Employee: '+esc(w.name||'Worker '+(i+1))+'</td></tr>'+
  '<tr style="height:'+HD+'pt;background:'+c[1]+';color:'+c[2]+';font-weight:bold;font-size:'+Math.min(fs,10)+'pt"><td>DAY / DATE</td><td>START</td><td>END</td><td>HOURS</td></tr>'+
  w.days.map(d=>'<tr style="height:'+rowH+'pt;border-bottom:1px solid #cfd9df"><td style="font-weight:bold;color:'+c[2]+'">'+esc(dayName(d.date)+', '+shortD(d.date))+'</td><td>'+(d.off?'OFF':esc(t12(d.start)))+'</td><td>'+(d.off?'OFF':esc(t12(d.end)))+'</td><td>'+num(d.hours)+'</td></tr>').join('')+
  '<tr style="height:'+BAR+'pt;background:'+c[0]+';color:#fff;font-weight:bold;font-size:'+(fs+1)+'pt"><td colspan="3">TOTAL HOURS</td><td>'+total(w)+'</td></tr></table>'};
  let groups='';
  for(let a=0;a<n;a+=k){groups+='<div'+(a+k<n?' style="page-break-after:always;break-after:page"':'')+'>'+S.workers.slice(a,a+k).map((w,m)=>tbl(w,a+m)).join('')+'</div>'}
  $('pv').innerHTML='<style>#pv td{padding:0 8px}</style><div style="font-family:Arial;color:#000;background:#fff"><div style="background:#1f3a4d;color:#fff;padding:14px;border-radius:0 0 14px 14px;margin-bottom:12px">'+(S.showName?'<div style="font-size:22px;font-weight:bold">'+esc(S.store||'Store name')+'</div>':'')+(S.showAddr?'<div>'+esc(S.addr||'Store address')+'</div>':'')+'<div style="font-weight:bold;margin-top:6px">WEEKLY WORK SCHEDULE: '+esc(longD(S.week))+' - '+esc(longD(addD(S.week,6)))+'</div></div>'+groups+'</div>';
}
$('bprint').onclick=()=>{
  let fired=false;const h=()=>{fired=true};
  window.addEventListener('beforeprint',h,{once:true});
  printView();
  try{window.print()}catch(e){}
  setTimeout(()=>{window.removeEventListener('beforeprint',h);if(!fired)saveDoc($('bprint'),5000,'Open the PDF, tap Print')},700);
};
banner();render();
</script>
</body>
